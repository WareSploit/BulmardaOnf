<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>Комната — ClipSync</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-glow"></div>

  <button id="themeToggle" class="theme-toggle" aria-label="Переключить тему"></button>

  <main class="container">
    <header class="header animate-in">
      <div class="room-header">
        <a href="index.html" class="back-btn" title="На главную">
          <span id="backIcon"></span>
        </a>
        <div class="room-title-block">
          <h1 class="room-title" id="roomNameLabel">Комната</h1>
          <div class="room-meta">
            <span class="room-code-inline" id="roomCodeLabel">----</span>
            <div id="roleBadge" class="role-badge"></div>
          </div>
        </div>
        <button id="usersToggle" class="users-toggle" title="Участники">
          <span id="usersIcon"></span>
          <span id="usersCount">1</span>
        </button>
      </div>
    </header>

    <div id="usersPanel" class="users-panel hidden">
      <div class="users-panel-header">
        <span>Участники</span>
        <button id="usersClose" class="icon-close" aria-label="Закрыть">
          <span id="usersCloseIcon"></span>
        </button>
      </div>
      <div id="usersList" class="users-list"></div>
      <p class="users-hint" id="usersHint">Кик — только для создателя</p>
    </div>

    <section class="card animate-in" style="--delay: 80ms">
      <div class="textarea-wrap">
        <textarea
          id="roomText"
          placeholder="Создатель печатает здесь..."
          rows="12"
          maxlength="100000"
        ></textarea>
        <div class="textarea-footer">
          <span id="charCount" class="char-count">0</span>
          <span id="readonlyHint" class="readonly-hint hidden">
            <span id="lockIcon"></span> Только чтение
          </span>
          <span id="liveHint" class="readonly-hint hidden">
            Обновляется в реальном времени
          </span>
        </div>
      </div>

      <div class="btn-row">
        <button id="copyBtn" class="btn btn-primary btn-copy">
          <span class="btn-icon" id="copyIcon"></span>
          <span class="btn-text">Копировать</span>
        </button>
        <button id="shareBtn" class="btn btn-secondary btn-icon-only" title="Поделиться">
          <span id="shareIcon"></span>
        </button>
        <button id="deleteBtn" class="btn btn-danger btn-icon-only hidden" title="Удалить комнату">
          <span id="deleteIcon"></span>
        </button>
      </div>

      <p id="savedHint" class="hint"></p>
    </section>

    <section class="card animate-in" style="--delay: 160ms">
      <p class="label">Поделиться ссылкой</p>
      <div class="link-row">
        <input id="roomLink" type="text" readonly />
        <button id="copyLinkBtn" class="btn btn-icon-only btn-secondary" title="Копировать">
          <span id="copyLinkIcon2"></span>
        </button>
      </div>
      <div class="qr-wrap">
        <div id="qrcode"></div>
      </div>
    </section>

    <footer class="footer">
      <span id="status" class="status">Подключение...</span>
    </footer>
  </main>

  <div id="toastContainer" class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script type="module" src="js/room.js?v=6"></script>
</body>
</html>
